name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Install Mesa for software OpenGL (llvmpipe)
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri

      - name: Check GPU renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch({
                args: ['--use-gl=egl', '--ignore-gpu-blocklist']
              });
              const page = await browser.newPage();
              await page.goto('chrome://gpu');
              const text = await page.textContent('body');
              for (const line of text.split('\n')) {
                if (/GL_RENDERER|GL_VENDOR|GL_VERSION|SwiftShader|llvmpipe|gpu.*status/i.test(line)) {
                  console.log(line.trim());
                }
              }
              await browser.close();
            })();
          "

      - name: Run e2e tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
