name: Deploy to GitHub Pages

on:
  # Rebuild and deploy whenever code lands on main.
  push:
    branches:
      - main
  # Allow manual redeploys from the Actions tab.
  workflow_dispatch:

# Least-privilege token plus the scopes the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # fonts are stored in Git LFS

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Production build uses a relative base (see vite.config.ts), so the same
      # dist/ resolves under the /billboard-builder/ Pages subpath and at root.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
