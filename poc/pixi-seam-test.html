<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PixiJS MSAA Seam Test</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #111; overflow: hidden; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    color: #aaa; font: 13px/1.8 monospace;
  }
  #hud button {
    padding: 2px 8px; margin: 0 2px;
    background: #333; color: #ccc; border: 1px solid #555;
    cursor: pointer; font: inherit;
  }
  #hud button:hover { background: #444; }
</style>
</head>
<body>
<div id="hud">
  <div>Zoom: <span id="zlabel">100%</span>
    <button onclick="setZoom(0.38)">38%</button>
    <button onclick="setZoom(0.65)">65%</button>
    <button onclick="setZoom(1)">100%</button>
    <button onclick="setZoom(1.5)">150%</button>
    <button onclick="setZoom(2)">200%</button>
  </div>
  <div>
    <label><input type="checkbox" id="rot" onchange="rebuild()"> Rotate 15&deg;</label>
    &nbsp;
    <label><input type="checkbox" id="aa" checked onchange="reinit()"> MSAA</label>
  </div>
  <div id="status" style="color:#666"></div>
</div>

<script src="https://pixijs.download/release/pixi.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// POC: Do two adjacent semi-transparent shapes rendered via PixiJS (WebGL
// with MSAA) produce a visible seam at their shared edge?
//
// Test 1 (top):    Solid semi-transparent fills (rgba 0,0,0,0.5)
// Test 2 (bottom): Gradient fills (opaque black → transparent black)
//
// Both sit on an orange background to make any seam obvious.
// ---------------------------------------------------------------------------

let app, root, curZoom = 1;

function makeGradientTexture(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  return PIXI.Texture.from(c);
}

async function init(antialias) {
  if (app) app.destroy(true, { children: true });

  app = new PIXI.Application();
  await app.init({
    width: innerWidth,
    height: innerHeight,
    antialias: antialias,
    backgroundColor: 0x111111,
    resolution: devicePixelRatio,
    autoDensity: true,
    preferWebGLVersion: 2,
  });
  document.body.appendChild(app.canvas);

  root = new PIXI.Container();
  app.stage.addChild(root);

  const rtype = app.renderer.name || app.renderer.constructor.name || 'unknown';
  document.getElementById('status').textContent =
    'Renderer: ' + rtype + ' | AA: ' + antialias;

  rebuild();
}

function rebuild() {
  root.removeChildren();
  const rotated = document.getElementById('rot').checked;

  // ---- Test 1: Solid semi-transparent fills ----
  const solidBg = new PIXI.Graphics().rect(0, 0, 400, 180).fill({ color: 0xff8c00 });
  root.addChild(solidBg);

  const sL = new PIXI.Graphics().rect(0, 0, 200, 180).fill({ color: 0x000000, alpha: 0.5 });
  root.addChild(sL);

  const sR = new PIXI.Graphics().rect(0, 0, 200, 180).fill({ color: 0x000000, alpha: 0.5 });
  sR.x = 200;
  root.addChild(sR);

  // Label
  const label1 = new PIXI.Text({ text: 'Solid  alpha=0.5', style: { fill: '#888', fontSize: 12, fontFamily: 'monospace' } });
  label1.x = 4; label1.y = 2;
  root.addChild(label1);

  // ---- Test 2: Gradient fills (Canvas2D texture → Sprite) ----
  const gradBg = new PIXI.Graphics().rect(0, 200, 400, 180).fill({ color: 0xff8c00 });
  root.addChild(gradBg);

  const tex = makeGradientTexture(512, 512); // oversized for quality
  const gL = new PIXI.Sprite(tex);
  gL.width = 200; gL.height = 180;
  gL.y = 200;
  root.addChild(gL);

  const gR = new PIXI.Sprite(tex);
  gR.width = 200; gR.height = 180;
  gR.x = 200; gR.y = 200;
  root.addChild(gR);

  const label2 = new PIXI.Text({ text: 'Gradient  #000F → #0000', style: { fill: '#888', fontSize: 12, fontFamily: 'monospace' } });
  label2.x = 4; label2.y = 202;
  root.addChild(label2);

  // ---- Test 3: Try native FillGradient if available ----
  if (PIXI.FillGradient) {
    const nativeBg = new PIXI.Graphics().rect(0, 400, 400, 180).fill({ color: 0xff8c00 });
    root.addChild(nativeBg);

    try {
      // v8 object constructor
      const gNatL = new PIXI.FillGradient({
        start: { x: 0, y: 0 }, end: { x: 0, y: 1 },
        colorStops: [
          { offset: 0, color: 'rgba(0,0,0,1)' },
          { offset: 1, color: 'rgba(0,0,0,0)' },
        ],
      });
      const nL = new PIXI.Graphics().rect(0, 400, 200, 180).fill(gNatL);
      root.addChild(nL);

      const gNatR = new PIXI.FillGradient({
        start: { x: 0, y: 0 }, end: { x: 0, y: 1 },
        colorStops: [
          { offset: 0, color: 'rgba(0,0,0,1)' },
          { offset: 1, color: 'rgba(0,0,0,0)' },
        ],
      });
      const nR = new PIXI.Graphics().rect(0, 0, 200, 180).fill(gNatR);
      nR.x = 200; nR.y = 400;
      root.addChild(nR);

      const label3 = new PIXI.Text({ text: 'Native FillGradient', style: { fill: '#888', fontSize: 12, fontFamily: 'monospace' } });
      label3.x = 4; label3.y = 402;
      root.addChild(label3);
    } catch (e) {
      console.warn('FillGradient failed, skipping native test:', e);
      const errLabel = new PIXI.Text({ text: 'FillGradient: ' + e.message, style: { fill: '#a44', fontSize: 12, fontFamily: 'monospace' } });
      errLabel.x = 4; errLabel.y = 402;
      root.addChild(errLabel);
    }
  }

  // Position / rotation
  const cx = innerWidth / 2, cy = innerHeight / 2;
  if (rotated) {
    root.pivot.set(200, 290);
    root.position.set(cx, cy);
    root.rotation = 15 * Math.PI / 180;
  } else {
    root.pivot.set(0, 0);
    root.position.set(cx - 200, cy - 290);
    root.rotation = 0;
  }
  root.scale.set(curZoom);
}

window.setZoom = function(z) {
  curZoom = z;
  root.scale.set(z);
  document.getElementById('zlabel').textContent = Math.round(z * 100) + '%';
};

window.reinit = async function() {
  await init(document.getElementById('aa').checked);
  setZoom(curZoom);
};

window.rebuild = rebuild;

init(true);
</script>
</body>
</html>
