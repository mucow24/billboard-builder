<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Layers Panel Mock</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #09101b;
        --panel: #0b1120;
        --panel-border: #1f2a40;
        --surface: #11192a;
        --surface-hover: #162238;
        --surface-active: #1a2842;
        --surface-selected: #243755;
        --surface-selected-soft: #141f32;
        --border: #24314b;
        --border-strong: #36507a;
        --badge: #273754;
        --row: #0f1728;
        --row-border: #1f2a40;
        --text: #edf3ff;
        --text-strong: #f8fbff;
        --text-secondary: #93a8c9;
        --text-muted: #6f85ab;
        --tree-accent: #34507a;
        --rule: #1b263d;
        --button-bg: #121b2c;
        --button-bg-active: #1d2d49;
        --button-border: #2b3956;
        --button-disabled: #101725;
        --toolbar-control-size: 1.8rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        background: var(--page);
        color: var(--text);
        font: 12px/1.2 Inter, "Segoe UI", Arial, sans-serif;
      }

      button {
        font: inherit;
      }

      .frame {
        width: 317px;
        height: 760px;
        background: var(--page);
      }

      .panel-shell {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #0d1526 0%, #0a1120 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          inset 0 0 0 1px rgba(255, 255, 255, 0.015);
      }

      .panel-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(72, 92, 127, 0.88);
        pointer-events: none;
        z-index: 20;
      }

      .properties-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .panel-section {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        padding: 0;
      }

      .rail-tab-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 0;
        border-bottom: 1px solid rgba(66, 87, 124, 0.62);
        background: linear-gradient(180deg, rgba(15, 23, 39, 0.96), rgba(11, 18, 32, 0.96));
        box-shadow: inset 0 -1px 0 rgba(5, 9, 16, 0.58);
      }

      .rail-tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-width: 0;
        min-height: 38px;
        padding: 0 10px;
        border: 0;
        border-right: 1px solid var(--rule);
        background: transparent;
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }

      .rail-tab:last-child {
        border-right: 0;
      }

      .rail-tab.active {
        color: var(--text-strong);
        background: rgba(31, 46, 74, 0.9);
      }

      .rail-tab.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 1px;
        background: rgba(126, 160, 214, 0.38);
      }

      .panel-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 14px;
        height: 14px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 3px;
        background: var(--badge);
        color: var(--text-strong);
        font-size: 10px;
        font-weight: 700;
      }

      .rail-tab-body {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        padding: 4px 8px 8px;
      }

      .rail-tab-body-layers {
        gap: 0;
      }

      .layer-list {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        padding: 4px 0 0;
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      .layer-list-tabbed {
        overflow: auto;
      }

      .tree-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
        z-index: 2;
      }

      .layer-list-rows {
        position: relative;
        z-index: 1;
      }

      .layer-row {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 0;
        padding-left: calc(var(--depth, 0) * 20px);
        background: transparent;
      }

      .layer-row-select {
        display: flex;
        align-items: center;
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        gap: 6px;
        min-height: 22px;
        padding: 1px 4px;
        border: 1px solid transparent;
        border-radius: 2px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        text-align: left;
        position: relative;
      }

      .layer-row + .layer-row {
        margin-top: 1px;
      }

      .layer-row:hover .layer-row-select {
        background: var(--surface-hover);
        border-color: rgba(54, 80, 122, 0.24);
      }

      .layer-row.contains-selection .layer-row-select {
        background: rgba(20, 31, 49, 0.44);
        border-color: rgba(54, 80, 122, 0.16);
      }

      .layer-row.in-selected-group .layer-row-select {
        background: rgba(23, 34, 54, 0.42);
        border-color: rgba(54, 80, 122, 0.16);
      }

      .layer-row.active .layer-row-select {
        background: rgba(37, 54, 83, 0.58);
        border-color: rgba(86, 118, 171, 0.56);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.025);
      }

      .layer-row-group .layer-row-select {
        min-height: 24px;
        background: rgba(15, 23, 38, 0.44);
        border-color: rgba(45, 63, 97, 0.16);
      }

      .layer-row-group:hover .layer-row-select {
        background: rgba(22, 35, 57, 0.7);
        border-color: rgba(54, 80, 122, 0.32);
      }

      .layer-row-group.contains-selection .layer-row-select {
        background: rgba(22, 33, 52, 0.58);
        border-color: rgba(63, 92, 136, 0.2);
      }

      .layer-row-group.in-selected-group .layer-row-select {
        background: rgba(21, 33, 54, 0.68);
        border-color: rgba(54, 80, 122, 0.24);
      }

      .layer-row-group.active .layer-row-select {
        background: rgba(34, 50, 78, 0.74);
        border-color: rgba(86, 118, 171, 0.48);
      }

      .layer-row-type {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        min-width: 14px;
        height: 14px;
        flex: 0 0 auto;
        border: 1px solid rgba(147, 168, 201, 0.26);
        border-radius: 2px;
        background: rgba(12, 19, 32, 0.92);
        color: var(--text-secondary);
        line-height: 1;
      }

      .layer-row-type-group {
        background: rgba(22, 35, 57, 0.96);
        border-color: rgba(108, 139, 187, 0.5);
        color: var(--text-strong);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .layer-row-type-toggle {
        cursor: pointer;
        padding: 0;
      }

      .layer-row-type-toggle:hover {
        border-color: rgba(147, 168, 201, 0.6);
        background: rgba(29, 47, 76, 0.98);
      }

      .layer-row-type-image::before {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: 2px;
        height: 5px;
        background:
          linear-gradient(140deg, transparent 0 22%, currentColor 22% 42%, transparent 42% 100%),
          linear-gradient(40deg, transparent 0 48%, currentColor 48% 68%, transparent 68% 100%);
        opacity: 0.85;
      }

      .layer-row-type-image::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
      }

      .layer-row-type-ellipse {
        border-radius: 999px;
      }

      .layer-row-type-line::before {
        content: "";
        position: absolute;
        left: 1px;
        right: 1px;
        top: 6px;
        height: 1px;
        background: currentColor;
        transform: rotate(-28deg);
        transform-origin: center;
      }

      .layer-row-type-text {
        border-radius: 2px;
      }

      .layer-row-copy {
        display: flex;
        min-width: 0;
        flex: 1 1 auto;
        align-items: baseline;
        gap: 6px;
      }

      .layer-row-copy.compact.richer {
        flex-direction: row;
      }

      .layer-row-copy strong {
        color: var(--text-strong);
        font-size: 10px;
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
      }

      .layer-row-copy small {
        display: block;
        color: var(--text-secondary);
        font-size: 9px;
        line-height: 1.25;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-bottom: 1px;
      }

      .layer-row-group .layer-row-copy strong {
        font-weight: 700;
        color: #f6f9ff;
      }

      .layer-row-group .layer-row-copy small {
        color: #9ab0d2;
      }

      .layer-row-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .layers-panel-footer {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-top: 0;
        margin-left: -8px;
        margin-right: -8px;
        padding: 0;
      }

      .footer-rule {
        display: none;
      }

      .order-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid rgba(66, 87, 124, 0.62);
        background: linear-gradient(180deg, rgba(11, 18, 31, 0.34), rgba(10, 16, 28, 0.18));
        box-shadow: 0 1px 0 rgba(5, 9, 16, 0.7);
        padding-left: 4px;
        padding-right: 4px;
        padding-bottom: 4px;
      }

      .order-controls {
        display: flex;
        align-items: center;
        gap: 3px;
        min-width: 0;
      }

      .layer-order-toolbar {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .toolbar-button,
      .background-button,
      .delete-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--toolbar-control-size);
        height: var(--toolbar-control-size);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 3px;
        background: rgba(19, 28, 46, 0.98);
        color: #f8fbff;
        line-height: 1;
        padding: 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .background-button {
        width: auto;
        padding: 0 5px 0 4px;
        gap: 3px;
      }

      .toolbar-button:hover:not(:disabled),
      .background-button:hover:not(:disabled) {
        border-color: rgba(129, 140, 248, 0.45);
      }

      .background-button {
        margin-left: 0;
      }

      .background-button[aria-pressed='true'] {
        border-color: rgba(125, 211, 252, 0.9);
        border-bottom-color: transparent;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        background: rgba(26, 39, 63, 1);
        z-index: 6;
      }

      .delete-button {
        border-color: rgba(102, 56, 67, 0.78);
        background: rgba(61, 28, 37, 0.98);
        color: #d09ca6;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .delete-button:hover:not(:disabled) {
        border-color: rgba(196, 88, 108, 0.72);
      }

      .delete-button:active:not(:disabled) {
        background: rgba(72, 29, 39, 0.98);
      }

      .toolbar-button:disabled,
      .background-button:disabled,
      .delete-button:disabled {
        border-color: rgba(148, 163, 184, 0.16);
        background: rgba(12, 20, 34, 0.67);
        color: rgba(248, 251, 255, 0.4);
        cursor: not-allowed;
        box-shadow: none;
      }

      .toolbar-button svg,
      .background-button svg,
      .delete-button svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        vector-effect: non-scaling-stroke;
      }

      .background-button-caret {
        width: 0;
        height: 0;
        border-left: 3px solid transparent;
        border-right: 3px solid transparent;
        border-top: 4px solid currentColor;
        opacity: 0.72;
        transform: translateY(1px);
      }

      .pinned-utility-row {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 148px;
        padding: 6px 8px;
        border: 1px solid rgba(66, 87, 124, 0.9);
        border-radius: 3px;
        background: linear-gradient(180deg, rgba(18, 27, 44, 0.98), rgba(11, 17, 29, 0.98));
        box-shadow:
          0 0 0 1px rgba(5, 9, 16, 0.42),
          0 6px 18px rgba(0, 0, 0, 0.34);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px) scale(0.98);
        transition:
          opacity 140ms ease,
          transform 170ms ease;
        z-index: 5;
      }

      .pinned-utility-row.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }

      .pinned-utility-row::before,
      .pinned-utility-row::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        left: var(--popup-caret-left, 18px);
        transform: translateX(-50%);
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
      }

      .pinned-utility-row::before {
        top: -6px;
        border-bottom: 6px solid rgba(66, 87, 124, 0.9);
      }

      .pinned-utility-row::after {
        top: -5px;
        border-bottom: 6px solid rgba(17, 26, 42, 0.98);
      }

      .swatch-card {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 18px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      .swatch-chip {
        --swatch-fill: rgba(255, 255, 255, 0.75);
        position: relative;
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        border: 1px solid #575757;
        background:
          linear-gradient(45deg, rgba(100, 113, 137, 0.35) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(100, 113, 137, 0.35) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(100, 113, 137, 0.35) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(100, 113, 137, 0.35) 75%),
          rgba(15, 21, 37, 0.95);
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
      }

      .swatch-chip::after {
        content: "";
        position: absolute;
        inset: 1px;
        background: var(--swatch-fill);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .background-button .swatch-chip {
        width: 10px;
        height: 10px;
      }

      .background-button .swatch-chip::after {
        inset: 0;
      }

      .swatch-copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .swatch-copy strong {
        color: var(--text-strong);
        font-size: 10px;
        line-height: 1.1;
        font-weight: 500;
        text-transform: none;
      }

      .swatch-copy small {
        color: var(--text-secondary);
        font-size: 9px;
        font-weight: 500;
      }

      .layers-panel-meta {
        margin-left: -8px;
        margin-right: -8px;
        padding: 0;
      }

      .layers-panel-meta-rule {
        height: 1px;
        background: rgba(66, 87, 124, 0.44);
      }

      .layers-panel-meta-copy {
        display: grid;
        place-items: center;
        height: 11px;
        padding: 0;
        color: #64789b;
        font-size: 9px;
        line-height: 1;
        font-weight: 500;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="panel-shell">
        <aside class="properties-panel">
          <section class="panel-section panel-section-tabbed-rail">
            <div class="rail-tab-strip" role="tablist" aria-label="Inspector panels">
              <button class="rail-tab" type="button" aria-selected="false">Properties</button>
              <button class="rail-tab active" type="button" aria-selected="true">
                Layers
                <span class="panel-badge" id="layers-badge">8</span>
              </button>
              <button class="rail-tab" type="button" aria-selected="false">
                Templates
                <span class="panel-badge">2</span>
              </button>
            </div>

            <div class="rail-tab-body rail-tab-body-layers">
              <div class="layers-panel-footer layers-panel-utilities">
                <div class="footer-rule"></div>
                <div class="order-row">
                  <div class="order-controls">
                    <div class="layer-order-toolbar" role="group" aria-label="Layer order controls">
                      <button class="toolbar-button" type="button" aria-label="Bring front">
                        <svg viewBox="0 0 12 12" aria-hidden="true">
                          <path d="M2 2.5h8"></path>
                          <path d="M6 8.5v-4.5"></path>
                          <path d="M4.25 5.75 6 4l1.75 1.75"></path>
                        </svg>
                      </button>
                      <button class="toolbar-button" type="button" aria-label="Forward">
                        <svg viewBox="0 0 12 12" aria-hidden="true">
                          <path d="M6 2.5v7"></path>
                          <path d="M3.5 4.5 6 2l2.5 2.5"></path>
                        </svg>
                      </button>
                      <button class="toolbar-button" type="button" aria-label="Backward">
                        <svg viewBox="0 0 12 12" aria-hidden="true">
                          <path d="M6 2.5v7"></path>
                          <path d="M3.5 7.5 6 10l2.5-2.5"></path>
                        </svg>
                      </button>
                      <button class="toolbar-button" type="button" aria-label="Send back">
                        <svg viewBox="0 0 12 12" aria-hidden="true">
                          <path d="M2 9.5h8"></path>
                          <path d="M6 3.5v4.5"></path>
                          <path d="M4.25 6.25 6 8l1.75-1.75"></path>
                        </svg>
                      </button>
                    </div>
                    <button id="background-toggle-button" class="background-button" type="button" aria-label="Show canvas background selector" aria-controls="background-selector" aria-expanded="false" aria-pressed="false">
                      <span id="background-toggle-swatch" class="swatch-chip" aria-hidden="true" style="--swatch-fill: #ffffff00;"></span>
                      <span class="background-button-caret" aria-hidden="true"></span>
                    </button>
                  </div>
                  <button id="delete-button" class="delete-button" type="button" aria-label="Delete selected (1)">
                    <svg viewBox="0 0 12 12" aria-hidden="true">
                      <path d="M3 3l6 6"></path>
                      <path d="M9 3 3 9"></path>
                    </svg>
                  </button>
                </div>
                <div class="footer-rule"></div>
                <div id="background-selector" class="pinned-utility-row" aria-hidden="true" style="left: 92px; top: 26px; --popup-caret-left: 18px;">
                  <div class="swatch-card">
                    <span id="background-selector-swatch" class="swatch-chip" aria-hidden="true" style="--swatch-fill: #ffffff00;"></span>
                    <span class="swatch-copy">
                      <strong>Canvas background</strong>
                      <small id="background-value">#ffffff00</small>
                    </span>
                  </div>
                </div>
              </div>

              <div id="layer-list" class="layer-list layer-list-tabbed" data-testid="layers-layer-list">
                <svg id="tree-overlay" class="tree-overlay" aria-hidden="true" viewBox="0 0 301 673" width="301" height="673"><line x1="12" y1="46" x2="12" y2="180" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line><line x1="12" y1="63" x2="25" y2="63" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line><line x1="12" y1="86" x2="25" y2="86" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line><line x1="12" y1="110" x2="25" y2="110" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line><line x1="12" y1="180" x2="25" y2="180" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line><line x1="32" y1="117" x2="32" y2="157" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line><line x1="32" y1="134" x2="45" y2="134" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line><line x1="32" y1="157" x2="45" y2="157" stroke="#34507a" stroke-width="1" shape-rendering="crispEdges"></line></svg>
                <div id="layer-list-rows" class="layer-list-rows"><div class="layer-row" style="--depth: 0;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Rectangle" aria-pressed="false"><span class="layer-row-type layer-row-type-rectangle" aria-hidden="true" style="background: rgb(255, 77, 77); border-color: rgba(147, 168, 201, 0.26); color: rgb(255, 77, 77);"></span><span class="layer-row-copy compact richer"><strong class="layer-row-label">Rectangle</strong></span></div></div><div class="layer-row active layer-row-group layer-row-group-expanded" style="--depth: 0;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Hero Group" aria-pressed="true"><button type="button" class="layer-row-type layer-row-type-group layer-row-type-toggle" aria-label="Collapse Hero Group">-</button><span class="layer-row-copy compact richer"><strong class="layer-row-label">Hero Group</strong><small>4 items</small></span></div></div><div class="layer-row in-selected-group" style="--depth: 1;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Text" aria-pressed="false"><span class="layer-row-type layer-row-type-text" aria-hidden="true" style="background: rgb(243, 246, 252); border-color: rgb(243, 246, 252); color: rgb(243, 246, 252);"></span><span class="layer-row-copy compact richer"><strong class="layer-row-label">Text</strong><small>“Spring drop now live”</small></span></div></div><div class="layer-row in-selected-group" style="--depth: 1;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Ellipse" aria-pressed="false"><span class="layer-row-type layer-row-type-ellipse" aria-hidden="true" style="background: rgb(59, 130, 246); border-color: rgba(147, 168, 201, 0.26); color: rgb(59, 130, 246);"></span><span class="layer-row-copy compact richer"><strong class="layer-row-label">Ellipse</strong></span></div></div><div class="layer-row in-selected-group layer-row-group layer-row-group-expanded" style="--depth: 1;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Details Cluster" aria-pressed="false"><button type="button" class="layer-row-type layer-row-type-group layer-row-type-toggle" aria-label="Collapse Details Cluster">-</button><span class="layer-row-copy compact richer"><strong class="layer-row-label">Details Cluster</strong><small>2 items</small></span></div></div><div class="layer-row in-selected-group" style="--depth: 2;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Text" aria-pressed="false"><span class="layer-row-type layer-row-type-text" aria-hidden="true" style="background: rgb(23, 222, 239); border-color: rgb(23, 222, 239); color: rgb(23, 222, 239);"></span><span class="layer-row-copy compact richer"><strong class="layer-row-label">Text</strong><small>“Free shipping over $75”</small></span></div></div><div class="layer-row in-selected-group" style="--depth: 2;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Ellipse" aria-pressed="false"><span class="layer-row-type layer-row-type-ellipse" aria-hidden="true" style="background: transparent; border-color: rgb(168, 85, 247); color: rgb(168, 85, 247);"></span><span class="layer-row-copy compact richer"><strong class="layer-row-label">Ellipse</strong></span></div></div><div class="layer-row in-selected-group" style="--depth: 1;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Line" aria-pressed="false"><span class="layer-row-type layer-row-type-line" aria-hidden="true" style="background: rgba(12, 19, 32, 0.92); border-color: rgba(147, 168, 201, 0.26); color: rgb(214, 226, 245);"></span><span class="layer-row-copy compact richer"><strong class="layer-row-label">Line</strong></span></div></div><div class="layer-row" style="--depth: 0;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Rectangle" aria-pressed="false"><span class="layer-row-type layer-row-type-rectangle" aria-hidden="true" style="background: rgb(37, 99, 235); border-color: rgb(34, 197, 94); color: rgb(34, 197, 94);"></span><span class="layer-row-copy compact richer"><strong class="layer-row-label">Rectangle</strong></span></div></div><div class="layer-row layer-row-group" style="--depth: 0;"><div class="layer-row-select" role="button" tabindex="0" aria-label="Legal" aria-pressed="false"><button type="button" class="layer-row-type layer-row-type-group layer-row-type-toggle" aria-label="Expand Legal">+</button><span class="layer-row-copy compact richer"><strong class="layer-row-label">Legal</strong><small>1 item</small></span></div></div></div>
              </div>

              <div class="layers-panel-meta" aria-hidden="true">
                <div class="layers-panel-meta-rule"></div>
                <div id="layers-panel-meta-copy" class="layers-panel-meta-copy">8 items</div>
              </div>
            </div>
          </section>
        </aside>
      </div>
    </div>

    <script>
      const state = {
        background: '#ffffff00',
        backgroundSelectorOpen: false,
        collapsedGroupIds: new Set(['legal-group']),
        rows: [
          {
            ancestorGroupIds: [],
            childCount: 0,
            depth: 0,
            hasChildren: false,
            selectableNodeId: 'headline-frame',
            node: {
              id: 'headline-frame',
              kind: 'rectangle',
              name: 'Headline Frame',
              fill: '#ff4d4d',
              stroke: '#ff4d4d',
              strokeWidth: 0,
            },
          },
          {
            ancestorGroupIds: [],
            childCount: 4,
            depth: 0,
            hasChildren: true,
            selectableNodeId: 'hero-group',
            node: {
              id: 'hero-group',
              kind: 'group',
              name: 'Hero Group',
            },
          },
          {
            ancestorGroupIds: ['hero-group'],
            childCount: 0,
            depth: 1,
            hasChildren: false,
            selectableNodeId: 'promo-headline',
            node: {
              id: 'promo-headline',
              kind: 'text',
              name: 'Text',
              text: 'Spring drop now live',
              fill: '#f3f6fc',
            },
          },
          {
            ancestorGroupIds: ['hero-group'],
            childCount: 0,
            depth: 1,
            hasChildren: false,
            selectableNodeId: 'promo-badge',
            node: {
              id: 'promo-badge',
              kind: 'ellipse',
              name: 'Badge',
              fill: '#3b82f6',
              stroke: '#3b82f6',
              strokeWidth: 0,
            },
          },
          {
            ancestorGroupIds: ['hero-group'],
            childCount: 2,
            depth: 1,
            hasChildren: true,
            selectableNodeId: 'details-cluster',
            node: {
              id: 'details-cluster',
              kind: 'group',
              name: 'Details Cluster',
            },
          },
          {
            ancestorGroupIds: ['hero-group', 'details-cluster'],
            childCount: 0,
            depth: 2,
            hasChildren: false,
            selectableNodeId: 'details-text',
            node: {
              id: 'details-text',
              kind: 'text',
              name: 'Text',
              text: 'Free shipping over $75',
              fill: '#17deef',
            },
          },
          {
            ancestorGroupIds: ['hero-group', 'details-cluster'],
            childCount: 0,
            depth: 2,
            hasChildren: false,
            selectableNodeId: 'details-ellipse',
            node: {
              id: 'details-ellipse',
              kind: 'ellipse',
              name: 'Pill',
              fill: 'transparent',
              stroke: '#a855f7',
              strokeWidth: 1,
            },
          },
          {
            ancestorGroupIds: ['hero-group'],
            childCount: 0,
            depth: 1,
            hasChildren: false,
            selectableNodeId: 'divider-line',
            node: {
              id: 'divider-line',
              kind: 'line',
              name: 'Divider',
              stroke: '#d6e2f5',
            },
          },
          {
            ancestorGroupIds: [],
            childCount: 0,
            depth: 0,
            hasChildren: false,
            selectableNodeId: 'offer-card',
            node: {
              id: 'offer-card',
              kind: 'rectangle',
              name: 'Offer Card',
              fill: '#2563eb',
              stroke: '#22c55e',
              strokeWidth: 1,
            },
          },
          {
            ancestorGroupIds: [],
            childCount: 1,
            depth: 0,
            hasChildren: true,
            selectableNodeId: 'legal-group',
            node: {
              id: 'legal-group',
              kind: 'group',
              name: 'Legal',
            },
          },
          {
            ancestorGroupIds: ['legal-group'],
            childCount: 0,
            depth: 1,
            hasChildren: false,
            selectableNodeId: 'legal-copy',
            node: {
              id: 'legal-copy',
              kind: 'text',
              name: 'Text',
              text: 'Terms apply',
              fill: '#f3f6fc',
            },
          },
        ],
        selectedNodeIds: new Set(['hero-group']),
      };

      const layerList = document.getElementById('layer-list');
      const layerListRows = document.getElementById('layer-list-rows');
      const treeOverlay = document.getElementById('tree-overlay');
      const layersBadge = document.getElementById('layers-badge');
      const layersPanelMetaCopy = document.getElementById('layers-panel-meta-copy');
      const backgroundSelector = document.getElementById('background-selector');
      const backgroundSelectorSwatch = document.getElementById('background-selector-swatch');
      const backgroundToggleButton = document.getElementById('background-toggle-button');
      const backgroundToggleSwatch = document.getElementById('background-toggle-swatch');
      const backgroundValue = document.getElementById('background-value');
      const deleteButton = document.getElementById('delete-button');
      const footerStrip = document.querySelector('.layers-panel-footer');
      const reorderButtons = Array.from(document.querySelectorAll('.toolbar-button'));
      const SVG_NS = 'http://www.w3.org/2000/svg';

      function isCanvasItemNode(node) {
        return node.kind !== 'group';
      }

      function getItemGlyph(kind) {
        switch (kind) {
          default:
            return '';
        }
      }

      function getLayerPrimaryLabel(node) {
        switch (node.kind) {
          case 'rectangle':
            return 'Rectangle';
          case 'ellipse':
            return 'Ellipse';
          case 'line':
            return 'Line';
          case 'text':
            return 'Text';
          case 'image':
            return 'Image';
          default:
            return node.name || 'Layer';
        }
      }

      function getLayerSecondaryLabel(row) {
        if (row.node.kind === 'group') {
          return `${row.childCount} item${row.childCount === 1 ? '' : 's'}`;
        }

        if (row.node.kind === 'text') {
          const compactText = (row.node.text || '').trim().replace(/\s+/g, ' ');
          const snippet = compactText.slice(0, 28);
          return snippet ? `“${snippet}${compactText.length > 28 ? '…' : ''}”` : 'Empty text';
        }

        return null;
      }

      function getLayerPreviewStyle(node) {
        if (node.kind === 'line') {
          return {
            background: 'rgba(12, 19, 32, 0.92)',
            borderColor: 'rgba(147, 168, 201, 0.26)',
            color: node.stroke,
          };
        }

        if (node.kind === 'rectangle' || node.kind === 'ellipse') {
          return {
            background: node.fill,
            borderColor:
              typeof node.strokeWidth === 'number' && node.strokeWidth > 0
                ? node.stroke || 'rgba(147, 168, 201, 0.26)'
                : 'rgba(147, 168, 201, 0.26)',
            color:
              typeof node.strokeWidth === 'number' && node.strokeWidth > 0
                ? node.stroke || node.fill
                : node.fill,
          };
        }

        if (node.kind === 'text') {
          return {
            background: node.fill,
            borderColor: node.fill,
            color: node.fill,
          };
        }

        if (node.kind === 'image') {
          return {
            background: 'rgba(12, 19, 32, 0.92)',
            borderColor: 'rgba(147, 168, 201, 0.26)',
            color: '#d6e2f5',
          };
        }

        return {};
      }

      function getVisibleRows() {
        return state.rows.filter((row) =>
          row.ancestorGroupIds.every((groupId) => !state.collapsedGroupIds.has(groupId))
        );
      }

      function rowHasSelectedDescendant(row) {
        if (!row.hasChildren) {
          return false;
        }

        return state.rows.some(
          (candidate) =>
            state.selectedNodeIds.has(candidate.node.id) &&
            candidate.ancestorGroupIds.includes(row.node.id)
        );
      }

      function rowIsInSelectedGroup(row) {
        return row.ancestorGroupIds.some((groupId) => state.selectedNodeIds.has(groupId));
      }

      function toggleSelection(nodeId) {
        if (state.selectedNodeIds.has(nodeId)) {
          state.selectedNodeIds.delete(nodeId);
        } else {
          state.selectedNodeIds.add(nodeId);
        }
        render();
      }

      function toggleCollapse(groupId) {
        if (state.collapsedGroupIds.has(groupId)) {
          state.collapsedGroupIds.delete(groupId);
        } else {
          state.collapsedGroupIds.add(groupId);
        }
        render();
      }

      function deleteSelectedRows() {
        if (state.selectedNodeIds.size === 0) {
          return;
        }

        const deletedIds = new Set(state.selectedNodeIds);
        let changed = true;

        while (changed) {
          changed = false;
          for (const row of state.rows) {
            if (deletedIds.has(row.node.id)) {
              continue;
            }
            if (row.ancestorGroupIds.some((ancestorId) => deletedIds.has(ancestorId))) {
              deletedIds.add(row.node.id);
              changed = true;
            }
          }
        }

        state.rows = state.rows.filter((row) => !deletedIds.has(row.node.id));
        state.selectedNodeIds.clear();

        for (const groupId of Array.from(state.collapsedGroupIds)) {
          if (deletedIds.has(groupId)) {
            state.collapsedGroupIds.delete(groupId);
          }
        }

        render();
      }

      function toggleBackgroundSelector() {
        state.backgroundSelectorOpen = !state.backgroundSelectorOpen;
        render();
      }

      function applySwatchColor(element, color) {
        element.style.setProperty('--swatch-fill', color);
      }

      function positionBackgroundSelector() {
        const footerRect = footerStrip.getBoundingClientRect();
        const buttonRect = backgroundToggleButton.getBoundingClientRect();
        const popupWidth = backgroundSelector.offsetWidth || 148;
        const left = Math.min(
          Math.max(buttonRect.left - footerRect.left - 4, 4),
          Math.max(4, footerRect.width - popupWidth - 4),
        );
        const top = buttonRect.bottom - footerRect.top + 6;
        const caretLeft = buttonRect.left - footerRect.left + buttonRect.width / 2 - left;

        backgroundSelector.style.left = `${Math.round(left)}px`;
        backgroundSelector.style.top = `${Math.round(top)}px`;
        backgroundSelector.style.setProperty('--popup-caret-left', `${Math.round(caretLeft)}px`);
      }

      function getParentNodeId(row) {
        return row.ancestorGroupIds[row.ancestorGroupIds.length - 1] ?? null;
      }

      function getElementPositionWithinScrollContent(element) {
        const listRect = layerList.getBoundingClientRect();
        const elementRect = element.getBoundingClientRect();
        return {
          height: elementRect.height,
          left: elementRect.left - listRect.left + layerList.scrollLeft,
          top: elementRect.top - listRect.top + layerList.scrollTop,
          width: elementRect.width,
        };
      }

      function appendTreeLine(x1, y1, x2, y2, attributes = {}) {
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', String(x1));
        line.setAttribute('y1', String(y1));
        line.setAttribute('x2', String(x2));
        line.setAttribute('y2', String(y2));
        line.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--tree-accent').trim());
        line.setAttribute('stroke-width', '1');
        line.setAttribute('shape-rendering', 'crispEdges');
        for (const [name, value] of Object.entries(attributes)) {
          if (value !== undefined && value !== null) {
            line.setAttribute(name, String(value));
          }
        }
        treeOverlay.append(line);
      }

      function renderTreeOverlay(visibleRows, rowElementsById) {
        treeOverlay.replaceChildren();

        const overlayHeight = Math.max(layerList.clientHeight, layerListRows.scrollHeight);
        treeOverlay.setAttribute('viewBox', `0 0 ${layerList.clientWidth} ${overlayHeight}`);
        treeOverlay.setAttribute('width', String(layerList.clientWidth));
        treeOverlay.setAttribute('height', String(overlayHeight));

        for (const row of visibleRows) {
          if (row.node.kind !== 'group' || state.collapsedGroupIds.has(row.node.id)) {
            continue;
          }

          const immediateChildren = visibleRows.filter(
            (candidate) => getParentNodeId(candidate) === row.node.id,
          );
          if (immediateChildren.length === 0) {
            continue;
          }

          const groupElements = rowElementsById.get(row.node.id);
          if (!groupElements) {
            continue;
          }

          const toggleBox = getElementPositionWithinScrollContent(groupElements.previewElement);
          const branchX = Math.round(toggleBox.left + toggleBox.width / 2);
          const branchTop = Math.round(toggleBox.top + toggleBox.height);
          const lastChildElements = rowElementsById.get(
            immediateChildren[immediateChildren.length - 1].node.id,
          );
          if (!lastChildElements) {
            continue;
          }

          const lastChildPreview = getElementPositionWithinScrollContent(lastChildElements.previewElement);
          const branchBottom = Math.round(lastChildPreview.top + lastChildPreview.height / 2);
          appendTreeLine(branchX, branchTop, branchX, branchBottom, {
            'data-parent-node-id': row.node.id,
            'data-testid': `layers-tree-trunk-${row.node.id}`,
          });

          for (const childRow of immediateChildren) {
            const childElements = rowElementsById.get(childRow.node.id);
            if (!childElements) {
              continue;
            }
            const childPreview = getElementPositionWithinScrollContent(childElements.previewElement);
            const connectorY = Math.round(childPreview.top + childPreview.height / 2);
            const connectorEndX = Math.round(childPreview.left);
            appendTreeLine(branchX, connectorY, connectorEndX, connectorY, {
              'data-child-node-id': childRow.node.id,
              'data-parent-node-id': row.node.id,
              'data-testid': `layers-tree-branch-${row.node.id}-${childRow.node.id}`,
            });
          }
        }
      }

      function createRowElement(row) {
        const isGroup = row.node.kind === 'group';
        const isCollapsed = isGroup && state.collapsedGroupIds.has(row.node.id);
        const isSelected = state.selectedNodeIds.has(row.selectableNodeId);
        const hasSelectedDescendant = rowHasSelectedDescendant(row);
        const isInSelectedGroup = rowIsInSelectedGroup(row);
        const rowLabel = isGroup ? row.node.name : getLayerPrimaryLabel(row.node);
        const secondary = getLayerSecondaryLabel(row);

        const rowElement = document.createElement('div');
        rowElement.className = 'layer-row';
        if (isSelected) {
          rowElement.classList.add('active');
        } else if (hasSelectedDescendant) {
          rowElement.classList.add('contains-selection');
        } else if (isInSelectedGroup) {
          rowElement.classList.add('in-selected-group');
        }
        if (isGroup) {
          rowElement.classList.add('layer-row-group');
          if (!isCollapsed && row.hasChildren) {
            rowElement.classList.add('layer-row-group-expanded');
          }
        }

        rowElement.style.setProperty('--depth', String(row.depth));

        const rowButton = document.createElement('div');
        rowButton.className = 'layer-row-select';
        rowButton.setAttribute('data-testid', `layers-row-${row.node.id}`);
        rowButton.setAttribute('role', 'button');
        rowButton.tabIndex = 0;
        rowButton.setAttribute('aria-label', rowLabel);
        rowButton.setAttribute('aria-pressed', String(isSelected));
        rowButton.addEventListener('click', () => {
          toggleSelection(row.selectableNodeId);
        });

        const glyph = document.createElement('span');
        if (isGroup) {
          const groupToggle = document.createElement('button');
          groupToggle.type = 'button';
          groupToggle.className = 'layer-row-type layer-row-type-group layer-row-type-toggle';
          groupToggle.setAttribute('data-testid', `layers-preview-anchor-${row.node.id}`);
          groupToggle.setAttribute('aria-label', `${isCollapsed ? 'Expand' : 'Collapse'} ${rowLabel}`);
          groupToggle.textContent = isCollapsed ? '+' : '-';
          groupToggle.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleCollapse(row.node.id);
          });
          rowButton.append(groupToggle);
        } else {
          glyph.className = `layer-row-type layer-row-type-${row.node.kind}`;
          glyph.setAttribute('data-testid', `layers-preview-anchor-${row.node.id}`);
          glyph.setAttribute('aria-hidden', 'true');
          Object.assign(glyph.style, getLayerPreviewStyle(row.node));
          glyph.textContent = getItemGlyph(row.node.kind);
          rowButton.append(glyph);
        }

        const copy = document.createElement('span');
        copy.className = 'layer-row-copy compact richer';
        copy.setAttribute('data-testid', `layers-row-copy-${row.node.id}`);

        const primary = document.createElement('strong');
        primary.className = 'layer-row-label';
        primary.setAttribute('data-testid', `layers-primary-label-${row.node.id}`);
        primary.textContent = rowLabel;
        copy.append(primary);

        if (secondary) {
          const secondaryText = document.createElement('small');
          secondaryText.setAttribute('data-testid', `layers-secondary-label-${row.node.id}`);
          secondaryText.textContent = secondary;
          copy.append(secondaryText);
        }

        rowButton.append(copy);
        rowElement.append(rowButton);
        return { previewElement: rowButton.firstElementChild, rowElement };
      }

      function render() {
        const visibleRows = getVisibleRows();
        const itemCount = state.rows.filter((row) => row.node.kind !== 'group').length;
        const canActOnSelection = state.selectedNodeIds.size > 0;
        const rowElementsById = new Map();

        layersBadge.textContent = String(itemCount);
        layersPanelMetaCopy.textContent = `${itemCount} item${itemCount === 1 ? '' : 's'}`;
        layerListRows.replaceChildren(
          ...visibleRows.map((row) => {
            const rowParts = createRowElement(row);
            rowElementsById.set(row.node.id, rowParts);
            return rowParts.rowElement;
          }),
        );
        renderTreeOverlay(visibleRows, rowElementsById);

        deleteButton.disabled = !canActOnSelection;
        deleteButton.setAttribute(
          'aria-label',
          canActOnSelection
            ? `Delete selected (${state.selectedNodeIds.size})`
            : 'Delete selected',
        );
        deleteButton.disabled = !canActOnSelection;

        for (const button of reorderButtons) {
          button.disabled = !canActOnSelection;
        }

        backgroundSelector.classList.toggle('open', state.backgroundSelectorOpen);
        backgroundSelector.setAttribute('aria-hidden', String(!state.backgroundSelectorOpen));
        backgroundToggleButton.setAttribute('aria-expanded', String(state.backgroundSelectorOpen));
        backgroundToggleButton.setAttribute('aria-pressed', String(state.backgroundSelectorOpen));
        backgroundToggleButton.setAttribute(
          'aria-label',
          `${state.backgroundSelectorOpen ? 'Hide' : 'Show'} canvas background selector`,
        );
        backgroundValue.textContent = state.background;
        applySwatchColor(backgroundToggleSwatch, state.background);
        applySwatchColor(backgroundSelectorSwatch, state.background);
        positionBackgroundSelector();
      }

      backgroundToggleButton.addEventListener('click', toggleBackgroundSelector);
      deleteButton.addEventListener('click', deleteSelectedRows);

      render();
    </script>
